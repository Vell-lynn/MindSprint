<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindSprint</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="start-screen" class="screen">
    <h1 style="font-size: 80px;">MindSprint</h1>
    <p>Mini Game Menjawab Kuis Pengasah Otak Sambil Menuntun Kelinci Menuju Wortel</p>
    <button id="start-btn">Mulai</button>
  </div>

  <div id="game-screen" class="screen hidden">
    <div id="status-bar">
        <div id="questionTimer">Waktu: 30</div>
        <div id="score">Score: 0</div>
        <div id="progress">Soal: 0/0</div>
    </div>
        
    <div class="game-container">
      <div id="quiz-container">
        
        <div id="question-container">
          <p id="question"></p>
          <div id="answer-buttons" aria-live="polite"></div>
        </div>
      </div>

      <div id="board-container">
        <div id="board">
          <div class="cell" data-index="0">🌱</div>
          <div class="cell" data-index="1"></div>
          <div class="cell" data-index="2"></div>
          <div class="cell" data-index="3"></div>
          <div class="cell" data-index="4"></div>
          <div class="cell" data-index="5"></div>
          <div class="cell" data-index="6"></div>
          <div class="cell" data-index="7"></div>
          <div class="cell" data-index="8"></div>
          <div class="cell" data-index="9"></div>
          <div class="cell" data-index="10"></div>
          <div class="cell" data-index="11">🥕</div>
        </div>
      </div>
    </div>
  </div>

  <div id="game-over-screen" class="screen hidden">
    <h1>Permainan Berakhir</h1>
    <p id="final-score">Skor Akhir: 0</p>
    <button id="restart-btn">Main Lagi</button>
  </div>

  <div id="confetti-container" aria-hidden="true"></div>


  <audio id="sfx-win" src="assets⁄win.mp3" preload="auto"></audio>
  <audio id="sfx-lose" src="assets⁄lose.mp3" preload="auto"></audio>

  <script src="script.js"></script>
</body>
</html>
